name: mybca_setting
description: "Fitur Notifikasi dan Pengaturan myBCA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0

  # Firebase (proyek yang sama dengan Digital-Bank: digitalbanking-b3e46)
  firebase_core: ^5.2.0
  cloud_firestore: ^7.2.0
  crypto: ^3.0.8   # hash PIN/password, sama dengan UserService milik Charlie
  intl: ^0.20.2    # dipakai notification_view.dart (sebelumnya hanya dependensi transitif)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true